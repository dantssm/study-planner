<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C92A2A"/>
    </marker>
  </defs>

  <rect width="1440" height="940" fill="#fff"/>

  <!-- ===== Студент ===== -->
  <circle cx="150" cy="330" r="55" fill="#1C3F74"/>
  <rect x="40" y="380" width="220" height="150" rx="55" fill="#1C3F74"/>
  <text x="150" y="440" text-anchor="middle" fill="#fff" font-size="22" font-weight="bold">Студент</text>
  <text x="150" y="465" text-anchor="middle" fill="#cfd8e6" font-size="15">[Person]</text>
  <text x="150" y="495" text-anchor="middle" fill="#cfd8e6" font-size="14">python planner.py "запит"</text>

  <!-- ===== Межа системи Study planner ===== -->
  <rect x="320" y="30" width="720" height="880" rx="14" fill="none" stroke="#2A5FB0" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="340" y="62" fill="#2A5FB0" font-size="20" font-weight="bold">Study planner</text>
  <text x="340" y="84" fill="#2A5FB0" font-size="14">[Software System] агентна система планування з MCP</text>

  <!-- Аналітик -->
  <rect x="350" y="130" width="300" height="200" rx="12" fill="#438DD5"/>
  <text x="500" y="170" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Аналітик</text>
  <text x="500" y="192" text-anchor="middle" fill="#e3eefa" font-size="14">[LLM-агент]</text>
  <text x="500" y="226" text-anchor="middle" fill="#fff" font-size="14">читає дедлайни й календар,</text>
  <text x="500" y="246" text-anchor="middle" fill="#fff" font-size="14">складає план навчальних блоків</text>
  <rect x="405" y="272" width="190" height="34" rx="17" fill="#fff" fill-opacity="0.18"/>
  <text x="500" y="295" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">тільки читання</text>

  <!-- Планувальник -->
  <rect x="710" y="130" width="300" height="200" rx="12" fill="#438DD5" stroke="#C92A2A" stroke-width="4"/>
  <text x="860" y="170" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Планувальник</text>
  <text x="860" y="192" text-anchor="middle" fill="#e3eefa" font-size="14">[LLM-агент]</text>
  <text x="860" y="226" text-anchor="middle" fill="#fff" font-size="14">перевіряє план за правилами R3–R5,</text>
  <text x="860" y="246" text-anchor="middle" fill="#fff" font-size="14">виправляє і записує блоки</text>
  <rect x="745" y="272" width="230" height="34" rx="17" fill="#C92A2A"/>
  <text x="860" y="295" text-anchor="middle" fill="#fff" font-size="15" font-weight="bold">єдиний має право писати</text>

  <!-- MCP-сервер -->
  <rect x="400" y="530" width="520" height="330" rx="12" fill="#2A5FB0"/>
  <text x="660" y="570" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">MCP-сервер study_planner</text>
  <text x="660" y="592" text-anchor="middle" fill="#dbe6f6" font-size="14">[Python, MCP stdio] наш код: server.py</text>

  <rect x="425" y="615" width="470" height="58" rx="8" fill="#fff"/>
  <text x="443" y="640" fill="#1C3F74" font-size="16" font-weight="bold" font-family="Menlo, monospace">get_deadlines</text>
  <text x="443" y="662" fill="#555" font-size="13">дедлайни з Moodle + опис + оцінка годин · читання</text>

  <rect x="425" y="683" width="470" height="58" rx="8" fill="#fff"/>
  <text x="443" y="708" fill="#1C3F74" font-size="16" font-weight="bold" font-family="Menlo, monospace">get_events</text>
  <text x="443" y="730" fill="#555" font-size="13">події з Google Calendar · читання</text>

  <rect x="425" y="751" width="470" height="80" rx="8" fill="#fff" stroke="#C92A2A" stroke-width="3"/>
  <text x="443" y="776" fill="#C92A2A" font-size="16" font-weight="bold" font-family="Menlo, monospace">create_study_block</text>
  <text x="443" y="798" fill="#555" font-size="13">записує блок у Google Calendar · ЗАПИС</text>
  <text x="443" y="818" fill="#555" font-size="13">відмовляє з hint: after_deadline (R1), time_conflict (R2)</text>

  <!-- ===== Зовнішні системи ===== -->
  <rect x="1110" y="60" width="300" height="160" rx="12" fill="#8C8496"/>
  <text x="1260" y="110" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">LLM</text>
  <text x="1260" y="134" text-anchor="middle" fill="#ecebf0" font-size="15">[Gemini API]</text>
  <text x="1260" y="170" text-anchor="middle" fill="#ecebf0" font-size="14">модель для рішень агентів</text>

  <rect x="1110" y="500" width="300" height="160" rx="12" fill="#8C8496"/>
  <text x="1260" y="550" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Google Calendar</text>
  <text x="1260" y="574" text-anchor="middle" fill="#ecebf0" font-size="15">[OAuth API]</text>
  <text x="1260" y="610" text-anchor="middle" fill="#ecebf0" font-size="14">тестовий календар студента</text>

  <rect x="1110" y="720" width="300" height="160" rx="12" fill="#8C8496"/>
  <text x="1260" y="770" text-anchor="middle" fill="#fff" font-size="21" font-weight="bold">Moodle Calendar</text>
  <text x="1260" y="794" text-anchor="middle" fill="#ecebf0" font-size="15">[URL, .ics]</text>
  <text x="1260" y="830" text-anchor="middle" fill="#ecebf0" font-size="14">дедлайни та опис завдань</text>

  <!-- ===== Стрілки ===== -->
  <!-- Студент -> Аналітик -->
  <path d="M260,420 L350,260" stroke="#333" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text x="248" y="318" fill="#333" font-size="14" font-weight="bold">1. запит</text>

  <!-- Аналітик -> Планувальник -->
  <path d="M650,215 L710,215" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="680" y="240" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">3. план</text>

  <!-- Аналітик -> MCP (читання) -->
  <path d="M500,330 L560,530" stroke="#333" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text x="340" y="420" fill="#333" font-size="14" font-weight="bold">2. get_deadlines,</text>
  <text x="340" y="440" fill="#333" font-size="14" font-weight="bold">get_events</text>
  <text x="340" y="460" fill="#666" font-size="13">через MCP-клієнт</text>

  <!-- Планувальник -> MCP (запис) -->
  <path d="M860,330 L800,530" stroke="#C92A2A" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="845" y="410" fill="#C92A2A" font-size="14" font-weight="bold">4. get_events,</text>
  <text x="845" y="430" fill="#C92A2A" font-size="14" font-weight="bold">create_study_block</text>
  <text x="845" y="450" fill="#C92A2A" font-size="13">помилка → hint → інший час</text>

  <!-- Агенти -> LLM -->
  <path d="M1010,165 L1110,140" stroke="#333" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <path d="M500,130 L500,105 L1050,105 L1110,105" stroke="#333" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text x="1260" y="248" text-anchor="middle" fill="#333" font-size="14">обидва агенти думають через LLM</text>

  <!-- MCP -> Google Calendar -->
  <path d="M920,640 L1110,600" stroke="#C92A2A" stroke-width="3" fill="none" marker-end="url(#arrow-red)"/>
  <text x="980" y="596" text-anchor="middle" fill="#C92A2A" font-size="14" font-weight="bold">read/write</text>
  <text x="980" y="613" text-anchor="middle" fill="#C92A2A" font-size="13">подій</text>

  <!-- MCP -> Moodle -->
  <path d="M920,780 L1110,800" stroke="#333" stroke-width="2" stroke-dasharray="7 5" fill="none" marker-end="url(#arrow)"/>
  <text x="980" y="772" text-anchor="middle" fill="#333" font-size="14" font-weight="bold">читає .ics</text>

  <!-- ===== Легенда ===== -->
  <path d="M40,850 L100,850" stroke="#333" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="110" y="855" fill="#333" font-size="14">читання</text>
  <path d="M40,885 L100,885" stroke="#C92A2A" stroke-width="3" marker-end="url(#arrow-red)"/>
  <text x="110" y="890" fill="#C92A2A" font-size="14">запис</text>
  <text x="40" y="815" fill="#333" font-size="14" font-weight="bold">Легенда</text>
</svg>
